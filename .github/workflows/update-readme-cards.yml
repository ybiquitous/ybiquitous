name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Generate and commit cards without pushing"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=tokyonight
          path: profile/stats.svg
          token: ${{ github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=tokyonight&layout=compact
          path: profile/top-langs.svg
          token: ${{ github.token }}

      - name: Commit cards
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add "profile/*.svg"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit --message="Update README cards"
          git show --stat HEAD
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry-run: skipping push"
            exit 0
          fi
          git push
          sha="$(git rev-parse HEAD)"
          echo "::notice title=README cards updated::Updated by commit ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}"
